---
name: "Build: Cache Docker Image"
on:
  push:
    branches:
      - main
    paths:
      - "cache/**/*"
      - .github/workflows/build-cache-docker-image.yml

concurrency:
  group: "${{github.workflow}}-${{github.ref}}-cache-docker-image"
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-cache-docker-image:
    env:
      APP_OWNER: credfeto
      APP_NAME: cache-checker

    runs-on: ubuntu-latest
    steps:
      - name: "Check out repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: "Docker: Login to GitHub Container Registry"
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{github.token}}

      - name: "Docker Trust Enable"
        shell: bash
        run: |
          echo "DOCKER_CONTENT_TRUST_ORIGINAL=${DOCKER_CONTENT_TRUST:-}" >> "$GITHUB_ENV"
          echo "DOCKER_CONTENT_TRUST=1" >> "$GITHUB_ENV"

      - name: "Docker: Test Build"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{github.workspace}}/cache
          platforms: linux/amd64
          load: true
          tags: |
            ${{env.APP_OWNER}}/${{env.APP_NAME}}:test
          provenance: false

      - name: "Docker: Build with tags"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{github.workspace}}/cache
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{env.APP_OWNER}}/${{env.APP_NAME}}:latest
          provenance: false

      - name: "Docker Trust Restore"
        shell: bash
        run: echo "DOCKER_CONTENT_TRUST=${DOCKER_CONTENT_TRUST_ORIGINAL:-}" >> "$GITHUB_ENV"
